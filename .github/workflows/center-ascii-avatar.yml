name: Center ASCII avatar

on:
  push:
    paths:
      - '.github/workflows/center-ascii-avatar.yml'

permissions:
  contents: write

jobs:
  center-avatar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Center biometric portrait
        shell: python
        run: |
          from pathlib import Path

          for file_name in ("assets/dark.svg", "assets/light.svg"):
              path = Path(file_name)
              text = path.read_text(encoding="utf-8")
              old = 'transform="translate(-10,-24)"'
              new = 'transform="translate(51,-12)"'
              if old not in text:
                  raise SystemExit(f"Expected transform not found in {file_name}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          text = text.replace("dark.svg?v=5", "dark.svg?v=6")
          text = text.replace("light.svg?v=5", "light.svg?v=6")
          readme.write_text(text, encoding="utf-8")

      - name: Commit centered portrait
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/dark.svg assets/light.svg README.md
          git commit -m "fix: center ASCII biometric portrait"
          git push
