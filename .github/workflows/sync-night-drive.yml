name: Sync night drive

on:
  push:
    paths:
      - '.github/workflows/sync-night-drive.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync synthwave scene and refresh README
        shell: bash
        run: |
          cp assets/emoji-city-dark.svg assets/emoji-city-light.svg
          sed -i 's/emoji-city-dark.svg?v=2/emoji-city-dark.svg?v=3/g' README.md
          sed -i 's/emoji-city-light.svg?v=2/emoji-city-light.svg?v=3/g' README.md
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/emoji-city-light.svg README.md
          git commit -m "chore: sync synthwave drive scene and refresh profile"
          git push
