name: Update contribution graph

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/scripts/render_contributions.py"
      - ".github/workflows/contributions.yml"

permissions:
  contents: write

concurrency:
  group: contribution-graph
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render exact contribution calendars
        env:
          GITHUB_LOGIN: Kanakoy-Yokanak
          CONTRIBUTIONS_TOKEN: ${{ secrets.CONTRIBUTIONS_TOKEN }}
        shell: bash
        run: |
          if [ -z "$CONTRIBUTIONS_TOKEN" ]; then
            echo "CONTRIBUTIONS_TOKEN is not configured; keeping the current graph unchanged."
            exit 0
          fi
          python .github/scripts/render_contributions.py

      - name: Commit updated calendars
        shell: bash
        run: |
          if git diff --quiet -- assets/contributions-dark.svg assets/contributions-light.svg; then
            echo "Contribution calendar is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contributions-dark.svg assets/contributions-light.svg
          git commit -m "chore: refresh contribution graph"
          git push
