name: Update contribution brick defense

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - ".github/scripts/render_contributions.py"
      - ".github/scripts/refine_brick_defense.py"
      - ".github/workflows/contributions.yml"

permissions:
  contents: write

concurrency:
  group: contribution-brick-defense
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render contribution brick defense
        env:
          GITHUB_LOGIN: Kanakoy-Yokanak
          CONTRIBUTIONS_TOKEN: ${{ github.token }}
          DEFENSE_SEED: ${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          python .github/scripts/render_contributions.py
          python .github/scripts/refine_brick_defense.py

      - name: Commit updated defense field
        shell: bash
        run: |
          if git diff --quiet -- assets/contributions-dark.svg assets/contributions-light.svg; then
            echo "Contribution defense field is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contributions-dark.svg assets/contributions-light.svg
          git commit -m "chore: refresh contribution brick defense"
          git push
