name: Fit ASCII avatar

on:
  push:
    paths:
      - '.github/workflows/fit-ascii-avatar.yml'

permissions:
  contents: write

jobs:
  fit-avatar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fit biometric portrait to frame
        shell: python
        run: |
          from pathlib import Path

          old = 'transform="translate(51,-12)"'
          new = 'transform="matrix(1.42 0 0 1.18 -324.480 -46.590)"'

          for file_name in ("assets/dark.svg", "assets/light.svg"):
              path = Path(file_name)
              text = path.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Expected transform not found in {file_name}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          text = text.replace("dark.svg?v=6", "dark.svg?v=7")
          text = text.replace("light.svg?v=6", "light.svg?v=7")
          readme.write_text(text, encoding="utf-8")

      - name: Commit fitted portrait
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/dark.svg assets/light.svg README.md
          git commit -m "fix: enlarge ASCII portrait to fit biometric frame"
          git push