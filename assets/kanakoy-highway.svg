<svg xmlns="http://www.w3.org/2000/svg" width="7680" height="4320" viewBox="0 0 7680 4320" role="img" aria-labelledby="title desc">
  <title id="title">Kanakoy Neon Highway</title>
  <desc id="desc">A code-drawn retro-futurist tropical night drive with a wet highway, original sports coupe, palms, mountains, skyline and a sliced sun.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#010108"/><stop offset=".48" stop-color="#09031b"/><stop offset=".78" stop-color="#26083a"/><stop offset="1" stop-color="#e02675"/></linearGradient>
    <linearGradient id="road" x2="0" y2="1"><stop stop-color="#191128"/><stop offset=".16" stop-color="#080711"/><stop offset="1" stop-color="#010206"/></linearGradient>
    <linearGradient id="sun" x2="0" y2="1"><stop stop-color="#fff1ba"/><stop offset=".42" stop-color="#ff9165"/><stop offset="1" stop-color="#ff207e"/></linearGradient>
    <linearGradient id="body" x2=".8" y2="1"><stop stop-color="#193546"/><stop offset=".15" stop-color="#10111d"/><stop offset=".56" stop-color="#030308"/><stop offset=".82" stop-color="#270b2f"/><stop offset="1" stop-color="#05050b"/></linearGradient>
    <linearGradient id="glass" x2="0" y2="1"><stop stop-color="#183d50"/><stop offset=".35" stop-color="#07101b"/><stop offset="1" stop-color="#16051e"/></linearGradient>
    <linearGradient id="tail" x2="1"><stop stop-color="#ffb04c"/><stop offset=".12" stop-color="#ff3a37"/><stop offset=".7" stop-color="#d8003f"/><stop offset="1" stop-color="#4d001b"/></linearGradient>
    <linearGradient id="reflection" x2="0" y2="1"><stop stop-color="#ff2b62" stop-opacity=".8"/><stop offset="1" stop-color="#ff006e" stop-opacity="0"/></linearGradient>
    <radialGradient id="haze"><stop stop-color="#ff7798" stop-opacity=".62"/><stop offset=".35" stop-color="#ba1f83" stop-opacity=".2"/><stop offset="1" stop-color="#36066c" stop-opacity="0"/></radialGradient>
    <radialGradient id="cyan"><stop stop-color="#bfffff"/><stop offset=".12" stop-color="#18e8ff"/><stop offset="1" stop-color="#04a4e8" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="42" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-50%" y="-100%" width="200%" height="300%"><feGaussianBlur stdDeviation="90"/></filter>
    <filter id="wet" x="-30%" y="-30%" width="160%" height="160%"><feTurbulence baseFrequency=".006 .055" numOctaves="3" seed="71" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="75"/></filter>
    <pattern id="grain" width="260" height="190" patternUnits="userSpaceOnUse"><filter id="noise"><feTurbulence baseFrequency=".7" numOctaves="2" seed="19"/></filter><rect width="260" height="190" filter="url(#noise)" opacity=".07"/></pattern>
    <clipPath id="sunClip"><circle cx="4840" cy="1900" r="720"/></clipPath>
