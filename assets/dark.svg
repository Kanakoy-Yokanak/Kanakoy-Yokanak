      <text x="24" y="92" fill="#7ee787">[+] AUTOMATION</text>
      <text x="178" y="92" fill="#c9d1d9">n8n / Webhooks / API Orchestration</text>

      <text x="24" y="118" fill="#7ee787">[+] AI_SYSTEMS</text>
      <text x="178" y="118" fill="#c9d1d9">Agents / Assistants / Integrations</text>

