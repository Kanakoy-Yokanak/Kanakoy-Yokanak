    <circle cx="61" cy="38" r="5" fill="#febc2e"/>
    <circle cx="79" cy="38" r="5" fill="#28c840"/>
    <text x="103" y="43" font-size="14" fill="#8b949e">kanakoy@github: ~/identity</text>

    <circle cx="1039" cy="38" r="4" fill="#39ff88" filter="url(#glow)">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="1053" y="43" font-size="12" fill="#39ff88">SECURE SESSION</text>
  </g>

  <rect x="34" y="62" width="1132" height="1" fill="url(#cyanLine)" opacity="0.65"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="80" y="103" font-size="15" fill="#39ff88">root@kanakoy:~$</text>
    <text x="223" y="103" font-size="15" fill="#e6edf3"> ./decode-profile --visual</text>
    <text x="80" y="142" font-size="15" fill="#7ee787" clip-path="url(#typeIdentity)">&gt; identity stream online :: systems / automation / ai / cloud / commerce</text>
    <rect x="637" y="128" width="9" height="18" fill="#39ff88">
      <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
    </rect>
