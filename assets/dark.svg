    <text x="85" y="0" font-size="11" fill="#39ff88">ENCRYPTED</text>
    <text x="198" y="0" font-size="11" fill="#8b949e">//</text>
    <text x="221" y="0" font-size="11" fill="#8b949e">focus</text>
    <text x="266" y="0" font-size="11" fill="#f0f6fc">BUILD • AUTOMATE • SCALE</text>
    <text x="805" y="0" font-size="11" fill="#8b949e">github.com/Kanakoy-Yokanak</text>
  </g>

  <rect x="80" y="705" width="1040" height="1" fill="url(#cyanLine)" opacity="0.35"/>
  <rect x="80" y="705" width="150" height="1" fill="#22d3ee" filter="url(#glow)">
    <animate attributeName="x" values="80;970;80" dur="9s" repeatCount="indefinite"/>
