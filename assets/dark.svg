<path d="M82 128h54M82 128v54M538 128h-54M538 128v54M82 632h54M82 632v-54M538 632h-54M538 632v-54" stroke="#22d3ee" stroke-width="1.5" opacity=".65"/><text x="68" y="674" font-size="10" class="muted">ASCII portrait // technical profile</text>

<text x="610" y="146" font-family="Arial,Helvetica,sans-serif" font-size="52" font-weight="700" letter-spacing="4" class="white">KANAKOY</text>
<text x="612" y="176" font-size="12.5" class="cyan">FULL STACK // AUTOMATION // CLOUD // REAL-TIME</text>
<text x="612" y="202" font-size="10.5" class="muted">Systems, integrations, infrastructure and production delivery.</text><path d="M610 222H1152" stroke="#22d3ee55"/>

<rect x="610" y="244" width="542" height="92" rx="12" class="card"/><text x="630" y="268" class="h">DEVELOPMENT</text><text x="630" y="292" class="g">Frontend</text><text x="748" y="292" class="t">Next.js / React / TypeScript</text><text x="630" y="312" class="g">Backend</text><text x="748" y="312" class="t">Node.js / REST APIs / services</text>
<rect x="610" y="348" width="542" height="92" rx="12" class="card"/><text x="630" y="372" class="h">AUTOMATION &amp; INTEGRATION</text><text x="630" y="396" class="g">Orchestration</text><text x="748" y="396" class="t">n8n / webhooks / APIs</text><text x="630" y="416" class="g">Operations</text><text x="748" y="416" class="t">PowerShell / jobs / workflows</text>
<rect x="610" y="452" width="542" height="92" rx="12" class="card"/><text x="630" y="476" class="h">REAL-TIME &amp; 3D</text><text x="630" y="500" class="g">Realtime</text><text x="748" y="500" class="t">WebSockets / Durable Objects</text><text x="630" y="520" class="g">3D</text><text x="748" y="520" class="t">Three.js / React Three Fiber</text>
<rect x="610" y="556" width="542" height="92" rx="12" class="card"/><text x="630" y="580" class="h">CLOUD &amp; DATA</text><text x="630" y="604" class="g">Cloud</text><text x="748" y="604" class="t">Cloudflare / edge / DNS / CI-CD</text><text x="630" y="624" class="g">Data</text><text x="748" y="624" class="t">PostgreSQL / Prisma / SQLite</text>
<rect x="610" y="660" width="542" height="28" rx="14" class="panel"/><text x="626" y="679" font-size="9.5" class="white">NEXT.JS • TYPESCRIPT • NODE.JS • N8N • CLOUDFLARE • THREE.JS</text>

<path d="M48 748H1152" stroke="#22d3ee" stroke-opacity=".22"/><text x="68" y="792" class="section">CURRENT SYSTEMS</text><text x="70" y="818" class="kicker">ACTIVE PRODUCT WORK // CURRENT REPOSITORIES</text>

<rect x="68" y="850" width="522" height="146" rx="15" class="card"/><text x="92" y="880" class="kicker">01 // WAHZZA</text><text x="92" y="912" class="title">Open Creation Engine</text><text x="92" y="940" class="body">Modular SaaS architecture, production infrastructure,</text><text x="92" y="962" class="body">integrations and visual creation systems.</text><circle cx="556" cy="878" r="6" fill="#39ff88" filter="url(#glow)"/>
<rect x="610" y="850" width="542" height="146" rx="15" class="card"/><text x="634" y="880" class="kicker">02 // WAHZZA-DJ</text><text x="634" y="912" class="title">Persistent social music world</text><text x="634" y="940" class="body">Realtime rooms, DJ queue, progression, builder,</text><text x="634" y="962" class="body">3D runtime and local Asset Forge.</text><circle cx="1118" cy="878" r="6" fill="#39ff88" filter="url(#glow)"/>
<rect x="68" y="1016" width="522" height="146" rx="15" class="card"/><text x="92" y="1046" class="kicker">03 // WAHZZA TOOLS</text><text x="92" y="1078" class="title">Browser-first utility platform</text><text x="92" y="1106" class="body">File, image, PDF, audio and video tools with</text><text x="92" y="1128" class="body">local-first processing and scalable execution.</text><circle cx="556" cy="1044" r="6" fill="#22d3ee" filter="url(#glow)"/>
<rect x="610" y="1016" width="542" height="146" rx="15" class="card"/><text x="634" y="1046" class="kicker">04 // OLHO DE GATO</text><text x="634" y="1078" class="title">Field operations dashboard</text><text x="634" y="1106" class="body">Mobile-first tire inspections, fleet history,</text><text x="634" y="1128" class="body">technical reports and field workflows.</text><circle cx="1118" cy="1044" r="6" fill="#22d3ee" filter="url(#glow)"/>

<text x="68" y="1234" class="section">ENGINEERING MODEL</text><text x="70" y="1260" class="kicker">ARCHITECTURE // DELIVERY // OPERATIONS</text>
<rect x="68" y="1290" width="1084" height="154" rx="15" class="card"/>
<text x="92" y="1322" class="h">GITHUB-FIRST PRODUCTION FLOW</text><text x="92" y="1354" font-size="12" class="white">SCAN → EXACT SHA → SMALL PATCH → CI GATES → DEPLOY → RUNTIME VALIDATION</text>
<text x="92" y="1386" class="body">DDD • CQRS • idempotency • race-condition control • rate limits • observability • testing</text><text x="92" y="1410" class="body">Cloudflare • GitHub Actions • PostgreSQL • WebSockets • Three.js • browser/mobile delivery</text>

<path d="M68 1490H1152" stroke="#22d3ee55"/><text x="68" y="1524" font-size="9.5" class="muted">BUILD • AUTOMATE • INTEGRATE • SECURE • SCALE</text><text x="1138" y="1524" font-size="9.5" text-anchor="end" class="muted">github.com/Kanakoy-Yokanak</text>
