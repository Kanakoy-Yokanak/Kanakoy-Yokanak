    </g>

    <g stroke="#22d3ee" stroke-width="1.5" opacity="0.8">
      <path d="M773 170V143H800"/>
      <path d="M1090 143H1117V170"/>
      <path d="M773 447V474H800"/>
      <path d="M1090 474H1117V447"/>
