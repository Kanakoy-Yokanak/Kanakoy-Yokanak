    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="775" y="500" font-size="11" fill="#8b949e">IDENTITY</text>
      <text x="884" y="500" font-size="11" fill="#f0f6fc">KANAKOY</text>

      <text x="775" y="525" font-size="11" fill="#8b949e">SOURCE</text>
