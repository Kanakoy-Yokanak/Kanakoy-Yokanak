<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Kanakoy cyber biometric developer profile</title>
  <desc id="desc">Animated terminal profile with ASCII biometric portrait, full stack development, automation, AI, cloud and e-commerce systems.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#080e14"/>
      <stop offset="1" stop-color="#050b10"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b141b"/>
      <stop offset="1" stop-color="#071017"/>
    </linearGradient>
    <linearGradient id="cyanLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22d3ee" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scanBeam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.42" stop-color="#22d3ee" stop-opacity="0.05"/>
      <stop offset="0.5" stop-color="#67e8f9" stop-opacity="0.7"/>
      <stop offset="0.58" stop-color="#22d3ee" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="greenLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39ff88" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#39ff88" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#39ff88" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#1f6f78" stroke-width="0.55" opacity="0.11"/>
    </pattern>
    <pattern id="microGrid" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M8 0H0V8" fill="none" stroke="#22d3ee" stroke-width="0.25" opacity="0.08"/>
    </pattern>

    <clipPath id="typeIdentity">
      <rect x="80" y="124" width="0" height="24">
        <animate attributeName="width" values="0;560;560" keyTimes="0;0.55;1" dur="5.5s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <clipPath id="typeLog1">
      <rect x="106" y="536" width="0" height="18">
        <animate attributeName="width" values="0;470;470" keyTimes="0;0.55;1" begin="0.8s" dur="6s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <clipPath id="typeLog2">
      <rect x="106" y="562" width="0" height="18">
        <animate attributeName="width" values="0;520;520" keyTimes="0;0.65;1" begin="1.8s" dur="7s" repeatCount="indefinite"/>
      </rect>
    </clipPath>

    <clipPath id="bioReveal">
      <rect x="775" y="154" width="340" height="0">
        <animate attributeName="height" values="0;318;318;0" keyTimes="0;0.2;0.92;1" dur="10s" repeatCount="indefinite"/>
      </rect>
    </clipPath>

    <clipPath id="bioWindow">
      <rect x="775" y="154" width="340" height="318" rx="8"/>
    </clipPath>
  </defs>

  <rect width="1200" height="760" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="760" rx="20" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="758" rx="19" fill="none" stroke="#1f2937"/>

  <circle cx="1090" cy="95" r="150" fill="#0ea5e9" opacity="0.035" filter="url(#soft)">
    <animate attributeName="opacity" values="0.02;0.065;0.02" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="180" cy="610" r="170" fill="#22c55e" opacity="0.025" filter="url(#soft)">
    <animate attributeName="opacity" values="0.015;0.05;0.015" dur="12s" repeatCount="indefinite"/>
  </circle>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
