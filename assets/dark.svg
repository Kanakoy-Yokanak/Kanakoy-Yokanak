  <text x="82" y="247" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" letter-spacing="1.15" fill="#22d3ee">FULL STACK // AUTOMATION // AI INTEGRATION // CLOUD SYSTEMS</text>
  <text x="82" y="274" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#8b949e">professional technology work since 2019 • business-driven engineering</text>

