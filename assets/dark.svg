    <rect x="1041" y="493" width="75" height="5" rx="2.5" fill="#16323a"/>
    <rect x="1041" y="493" width="75" height="5" rx="2.5" fill="#39ff88" filter="url(#glow)">
      <animate attributeName="width" values="10;75;75;10" keyTimes="0;0.25;0.9;1" dur="10s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g transform="translate(80 635)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <g>
      <rect width="156" height="54" rx="9" fill="#0b131b" stroke="#21424b"/>
      <text x="17" y="22" font-size="10" fill="#8b949e">STACK</text>
      <text x="17" y="40" font-size="12" fill="#22d3ee">TYPESCRIPT</text>
    </g>
    <g transform="translate(168 0)">
      <rect width="156" height="54" rx="9" fill="#0b131b" stroke="#21424b"/>
      <text x="17" y="22" font-size="10" fill="#8b949e">RUNTIME</text>
      <text x="17" y="40" font-size="12" fill="#22d3ee">NODE.JS</text>
    </g>
    <g transform="translate(336 0)">
      <rect width="156" height="54" rx="9" fill="#0b131b" stroke="#21424b"/>
      <text x="17" y="22" font-size="10" fill="#8b949e">AUTOMATION</text>
      <text x="17" y="40" font-size="12" fill="#22d3ee">N8N</text>
    </g>
    <g transform="translate(504 0)">
      <rect width="156" height="54" rx="9" fill="#0b131b" stroke="#21424b"/>
      <text x="17" y="22" font-size="10" fill="#8b949e">CLOUD</text>
      <text x="17" y="40" font-size="12" fill="#22d3ee">CLOUDFLARE</text>
    </g>
    <g transform="translate(672 0)">
      <rect width="156" height="54" rx="9" fill="#0b131b" stroke="#21424b"/>
      <text x="17" y="22" font-size="10" fill="#8b949e">DATA</text>
      <text x="17" y="40" font-size="12" fill="#22d3ee">SQL / PRISMA</text>
    </g>
    <g transform="translate(840 0)">
      <rect width="200" height="54" rx="9" fill="#0b131b" stroke="#21424b"/>
      <text x="17" y="22" font-size="10" fill="#8b949e">BUSINESS_SYSTEMS</text>
      <text x="17" y="40" font-size="12" fill="#22d3ee">ECOM / API / AI</text>
    </g>
  </g>

  <g transform="translate(80 724)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
