<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc">
<title id="title">Kanakoy technical profile</title>
<desc id="desc">Technical profile focused on current products, full stack engineering, automation, cloud, realtime systems, data and production delivery.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#061019"/><stop offset="1" stop-color="#0a1620"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#39ff88"/></linearGradient>
  <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset=".5" stop-color="#22d3ee" stop-opacity=".32"/><stop offset="1" stop-color="#39ff88" stop-opacity="0"/></linearGradient>
  <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#22d3ee" stroke-width=".55" opacity=".07"/></pattern>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
  text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .muted{fill:#8193a5}.white{fill:#f0f6fc}.cyan{fill:#22d3ee}.green{fill:#39ff88}
  .section{font-size:28px;font-weight:700;letter-spacing:2px;fill:#f0f6fc}
  .kicker{font-size:11px;font-weight:700;letter-spacing:1.6px;fill:#22d3ee}
  .title{font-size:18px;font-weight:700;fill:#f0f6fc}
  .body{font-size:12px;fill:#a9bac8}.tiny{font-size:10px;fill:#8193a5}
  .card{fill:#08141d;stroke:#22d3ee44;stroke-width:1.2}
  .chip{fill:#0b1a24;stroke:#22d3ee55;stroke-width:1}
</style>
<rect width="1200" height="1500" rx="22" fill="url(#bg)"/>
<rect width="1200" height="1500" rx="22" fill="url(#grid)"/>
<rect x="1" y="1" width="1198" height="1498" rx="21" fill="none" stroke="url(#accent)" stroke-opacity=".55"/>

